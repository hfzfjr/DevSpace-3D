server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kompresi Gzip untuk JS, CSS, JSON, WASM, dan GLB
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        model/gltf-binary
        image/svg+xml;

    # Endpoint ringan untuk health check Coolify
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Bundle JS/CSS ber-hash Vite (cache 1 tahun immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Decoder WebAssembly Draco (.wasm & .js)
    location ~* ^/draco/.*\.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /draco/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # File 3D model (.glb) dengan MIME type standar & revalidate wajar saat ada update model
    location ~* \.glb$ {
        types { model/gltf-binary glb; }
        default_type model/gltf-binary;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA fallback (index.html tidak di-cache paksa agar update deploy langsung terlihat)
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
